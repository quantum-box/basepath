[package]
name = "pathbase-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aes-gcm = "0.10.3"
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
utoipa = { version = "5", features = ["chrono"] }
rmcp = { version = "1.5.0", features = ["transport-io", "transport-streamable-http-server"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9.3"
base64 = "0.22"
url = "2"
lambda_http = "0.13"

[[bin]]
name = "lambda-pathbase-api"
path = "src/bin/lambda.rs"

[dev-dependencies]
tempfile = "3"
