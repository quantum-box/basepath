# PathBase Lambda buildspec for Tachyon Cloud Apps.
#
# Lambda avoids publishing a long-lived registry credential into the app
# runtime. The artifact contains both the Rust HTTP server and the built SPA;
# Tachyon attaches the Lambda Web Adapter when framework=rust_server.

version: 0.2

env:
  variables:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8

phases:
  install:
    commands:
      - |
        set -eu
        if ! command -v rustup >/dev/null 2>&1; then
          echo "Installing Rust toolchain..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.95.0
        fi
        . "$HOME/.cargo/env"
        rustup toolchain install 1.95.0 --profile minimal
        rustup default 1.95.0
        if ! command -v zip >/dev/null 2>&1; then
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y zip
          else
            yum install -y zip
          fi
        fi
        node --version
        npm --version
        cargo --version
      - |
        set -eu
        MACHINE=$(uname -m)
        case "${MACHINE}" in
          x86_64) CLI_ASSET_ARCH=x86_64 ;;
          aarch64) CLI_ASSET_ARCH=arm64 ;;
          *) echo "ERROR: Unsupported build architecture: ${MACHINE}"; exit 1 ;;
        esac
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "ERROR: GITHUB_TOKEN is required to download the Tachyon build CLI"
          exit 1
        fi
        CLI_TAG=tachyon-cli-v0.6.31
        CLI_ASSET="tachyon-linux-musl-${CLI_ASSET_ARCH}.tar.gz"
        ASSET_URL=$(curl -fsS \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "User-Agent: tachyon-cloud-app" \
          "https://api.github.com/repos/quantum-box/tachyon-sdk/releases/tags/${CLI_TAG}" \
          | python3 -c 'import json,sys; name=sys.argv[1]; release=json.load(sys.stdin); print(next(asset["url"] for asset in release["assets"] if asset["name"] == name))' \
            "${CLI_ASSET}")
        REDIRECT_URL=$(curl -sS -w '%{redirect_url}' -o /dev/null \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/octet-stream" \
          -H "User-Agent: tachyon-cloud-app" \
          "${ASSET_URL}")
        if [ -z "${REDIRECT_URL}" ]; then
          echo "ERROR: Tachyon CLI asset did not return a download URL"
          exit 1
        fi
        curl -fsSL "${REDIRECT_URL}" -o /tmp/tachyon-cli.tar.gz
        mkdir -p /tmp/tachyon-cli
        tar -xzf /tmp/tachyon-cli.tar.gz -C /tmp/tachyon-cli
        install -m 755 /tmp/tachyon-cli/tachyon /usr/local/bin/tachyon-build
        tachyon-build --version
  pre_build:
    commands:
      - |
        set -eu
        : "${CLOUD_APP_ARTIFACT_BUCKET:?CLOUD_APP_ARTIFACT_BUCKET is required}"
        : "${CLOUD_APP_ARTIFACT_KEY:?CLOUD_APP_ARTIFACT_KEY is required}"
        echo "Building PathBase Lambda artifact for ${INTERNAL_BUILD_ID:-unknown}"
  build:
    commands:
      - |
        set -eo pipefail
        cd "${CODEBUILD_SRC_DIR}"
        npm ci --no-audit --no-fund 2>&1 | tee -a /tmp/build.log
        npm run build 2>&1 | tee -a /tmp/build.log
      - |
        set -eo pipefail
        . "$HOME/.cargo/env"
        cd "${CODEBUILD_SRC_DIR}/api"
        cargo build --locked --release 2>&1 | tee -a /tmp/build.log
  post_build:
    commands:
      - |
        IAC_EXIT_CODE=1
        IAC_EXECUTION_STATE=not_reported
        if ! command -v tachyon-build >/dev/null 2>&1; then
          IAC_PLAN_OUTPUT="ERROR: Tachyon build CLI is unavailable"
        elif [ -z "${TACHYON_AUTH_TOKEN:-}" ]; then
          IAC_PLAN_OUTPUT="ERROR: TACHYON_AUTH_TOKEN is unavailable"
        else
          export TACHYON_API_KEY="${TACHYON_AUTH_TOKEN}"
          export TACHYON_TENANT_ID=tn_01hjjn348rn3t49zz6hvmfq67p
          export TACHYON_API_URL=https://api.n1.tachy.one
          set +e
          IAC_PLAN_OUTPUT=$(tachyon-build manifest apply \
            -f "${CODEBUILD_SRC_DIR}/tachyon.yml" \
            --app pathbase \
            --environment production \
            --dry-run \
            2>&1)
          IAC_EXIT_CODE=$?
          set -e
          if [ "${IAC_EXIT_CODE}" = "0" ] || [ "${IAC_EXIT_CODE}" = "2" ]; then
            IAC_EXECUTION_STATE=succeeded
          else
            IAC_EXECUTION_STATE=failed
          fi
        fi
        printf '%s' "${IAC_PLAN_OUTPUT}" > /tmp/iac_output.txt
        printf '%s' "${IAC_EXIT_CODE}" > /tmp/iac_exit_code.txt
        printf '%s' "${IAC_EXECUTION_STATE}" > /tmp/iac_execution_state.txt
        echo "Tachyon IaC execution state: ${IAC_EXECUTION_STATE}"
        if [ "${IAC_EXIT_CODE}" != "0" ] && [ "${IAC_EXIT_CODE}" != "2" ]; then
          echo "${IAC_PLAN_OUTPUT}"
          exit "${IAC_EXIT_CODE}"
        fi
      - |
        set -eo pipefail
        PACKAGE_DIR=/tmp/pathbase-lambda
        rm -rf "${PACKAGE_DIR}"
        mkdir -p "${PACKAGE_DIR}/web" "${CODEBUILD_SRC_DIR}/tachyon-artifacts"
        cp "${CODEBUILD_SRC_DIR}/api/target/release/pathbase-api" \
          "${PACKAGE_DIR}/bootstrap"
        chmod +x "${PACKAGE_DIR}/bootstrap"
        cp -R "${CODEBUILD_SRC_DIR}/dist/client/." "${PACKAGE_DIR}/web/"
        (cd "${PACKAGE_DIR}" && zip -qr /tmp/lambda.zip bootstrap web)
        cp /tmp/lambda.zip "${CODEBUILD_SRC_DIR}/tachyon-artifacts/lambda.zip"
        ARTIFACT_PATH="s3://${CLOUD_APP_ARTIFACT_BUCKET}/${CLOUD_APP_ARTIFACT_KEY}"
        echo "Uploading Lambda artifact to ${ARTIFACT_PATH}"
        aws s3 cp /tmp/lambda.zip "${ARTIFACT_PATH}" 2>&1 | tee -a /tmp/build.log
    finally:
      - |
        if [ -n "${CALLBACK_URL:-}" ]; then
          STATUS=FAILURE
          ERROR_JSON=null
          ARTIFACT_JSON=null
          IAC_PLAN_OUTPUT=""
          IAC_EXIT_CODE=1
          IAC_EXECUTION_STATE=not_reported
          if [ -f /tmp/iac_output.txt ]; then
            IAC_PLAN_OUTPUT=$(cat /tmp/iac_output.txt 2>/dev/null || true)
          fi
          if [ -f /tmp/iac_exit_code.txt ]; then
            IAC_EXIT_CODE=$(cat /tmp/iac_exit_code.txt 2>/dev/null || echo 1)
          fi
          if [ -f /tmp/iac_execution_state.txt ]; then
            IAC_EXECUTION_STATE=$(cat /tmp/iac_execution_state.txt 2>/dev/null || echo not_reported)
          fi
          if [ -n "${CLOUD_APP_ARTIFACT_BUCKET:-}" ] \
              && [ -n "${CLOUD_APP_ARTIFACT_KEY:-}" ]; then
            ARTIFACT_JSON="\"s3://${CLOUD_APP_ARTIFACT_BUCKET}/${CLOUD_APP_ARTIFACT_KEY}\""
          fi
          if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" = "1" ]; then
            STATUS=SUCCESS
          elif [ "${IAC_EXECUTION_STATE}" = failed ] \
              || [ "${IAC_EXECUTION_STATE}" = not_reported ]; then
            ERROR_JSON=$(printf '%s' "${IAC_PLAN_OUTPUT}" \
              | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' \
              2>/dev/null || echo '"Tachyon IaC failed"')
          elif [ -f /tmp/build.log ]; then
            ERROR_JSON=$(tail -50 /tmp/build.log \
              | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' \
              2>/dev/null || echo '"Build failed (log capture error)"')
          else
            ERROR_JSON='"Build failed"'
          fi
          IAC_JSON=$(printf '%s' "${IAC_PLAN_OUTPUT}" \
            | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' \
            2>/dev/null || echo null)
          IAC_SUCCESS=false
          if [ "${IAC_EXECUTION_STATE}" = succeeded ]; then
            IAC_SUCCESS=true
          fi
          DURATION_SECS=0
          if [ -n "${CODEBUILD_START_TIME:-}" ]; then
            NOW_SECS=$(date +%s)
            START_SECS=$((CODEBUILD_START_TIME / 1000))
            DURATION_SECS=$((NOW_SECS - START_SECS))
            if [ "${DURATION_SECS}" -lt 0 ]; then DURATION_SECS=0; fi
          fi
          curl -sf --retry 3 --max-time 10 \
            -X POST "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\
              \"build_id\":\"${INTERNAL_BUILD_ID:-}\",\
              \"status\":\"${STATUS}\",\
              \"image_uri\":null,\
              \"artifact_path\":${ARTIFACT_JSON},\
              \"duration_secs\":${DURATION_SECS},\
              \"error_message\":${ERROR_JSON},\
              \"iac_plan_output\":${IAC_JSON},\
              \"iac_success\":${IAC_SUCCESS},\
              \"iac_execution_state\":\"${IAC_EXECUTION_STATE}\",\
              \"d1_migrations\":null,\
              \"cache_hit\":false,\
              \"cache_key\":null\
            }" \
            || echo "Callback failed (non-fatal)"
        fi

artifacts:
  files:
    - lambda.zip
  base-directory: tachyon-artifacts
