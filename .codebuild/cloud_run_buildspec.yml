# Cloud Run buildspec for Tachyon Cloud Apps.
#
# Keeping this in the repository avoids AWS CodeBuild's inline buildspec size
# limit while preserving Tachyon's image push and deployment callback contract.

version: 0.2

env:
  variables:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8

phases:
  install:
    commands:
      - echo "Using the PathBase Cloud Run buildspec"
      - |
        if ! command -v gcloud &>/dev/null; then
          echo "Installing Google Cloud SDK..."
          curl -sSL https://sdk.cloud.google.com \
            | bash -s -- --disable-prompts
          source "$HOME/google-cloud-sdk/path.bash.inc"
        fi
      - |
        GAR_HOST=$(echo "${CONTAINER_REGISTRY}" | cut -d/ -f1)
        echo "Authenticating to Artifact Registry: ${GAR_HOST}"
        gcloud auth configure-docker "${GAR_HOST}" --quiet
      - |
        MACHINE=$(uname -m)
        case "${MACHINE}" in
          x86_64) CLI_ASSET_ARCH=x86_64 ;;
          aarch64) CLI_ASSET_ARCH=arm64 ;;
          *) echo "ERROR: Unsupported build architecture: ${MACHINE}"; exit 1 ;;
        esac
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "ERROR: GITHUB_TOKEN is required to download the Tachyon build CLI"
          exit 1
        fi
        CLI_TAG=tachyon-cli-v0.6.31
        CLI_ASSET="tachyon-linux-musl-${CLI_ASSET_ARCH}.tar.gz"
        ASSET_URL=$(curl -fsS \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "User-Agent: tachyon-cloud-app" \
          "https://api.github.com/repos/quantum-box/tachyon-sdk/releases/tags/${CLI_TAG}" \
          | python3 -c 'import json,sys; name=sys.argv[1]; release=json.load(sys.stdin); print(next(asset["url"] for asset in release["assets"] if asset["name"] == name))' \
            "${CLI_ASSET}")
        REDIRECT_URL=$(curl -sS -w '%{redirect_url}' -o /dev/null \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/octet-stream" \
          -H "User-Agent: tachyon-cloud-app" \
          "${ASSET_URL}")
        if [ -z "${REDIRECT_URL}" ]; then
          echo "ERROR: Tachyon CLI asset did not return a download URL"
          exit 1
        fi
        curl -fsSL "${REDIRECT_URL}" -o /tmp/tachyon-cli.tar.gz
        mkdir -p /tmp/tachyon-cli
        tar -xzf /tmp/tachyon-cli.tar.gz -C /tmp/tachyon-cli
        install -m 755 /tmp/tachyon-cli/tachyon /usr/local/bin/tachyon-build
        tachyon-build --version
  pre_build:
    commands:
      - |
        IMAGE_URI="${CONTAINER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
        echo "IMAGE_URI=${IMAGE_URI}" > /tmp/build_env.sh
        if [ -n "${ROOT_DIRECTORY}" ] \
            && [ -f "${CODEBUILD_SRC_DIR}/${ROOT_DIRECTORY}/Dockerfile" ]; then
          echo "DOCKER_FILE=${CODEBUILD_SRC_DIR}/${ROOT_DIRECTORY}/Dockerfile" \
            >> /tmp/build_env.sh
          echo "BUILD_CONTEXT=${CODEBUILD_SRC_DIR}" >> /tmp/build_env.sh
          echo "Using Dockerfile from ${ROOT_DIRECTORY} with repo-root context"
        elif [ -f "${CODEBUILD_SRC_DIR}/Dockerfile" ]; then
          echo "DOCKER_FILE=${CODEBUILD_SRC_DIR}/Dockerfile" >> /tmp/build_env.sh
          echo "BUILD_CONTEXT=${CODEBUILD_SRC_DIR}" >> /tmp/build_env.sh
          echo "Using repo-root Dockerfile"
        else
          echo "ERROR: No Dockerfile found. Set ROOT_DIRECTORY or place a Dockerfile at repo root."
          exit 1
        fi
  build:
    commands:
      - |
        source /tmp/build_env.sh
        echo "Building Docker image: ${IMAGE_URI}"
        set -o pipefail
        docker build \
          -t "${IMAGE_URI}" \
          -f "${DOCKER_FILE}" \
          "${BUILD_CONTEXT}" \
          2>&1 | tee -a /tmp/build.log
  post_build:
    commands:
      - |
        IAC_EXIT_CODE=1
        IAC_EXECUTION_STATE=not_reported
        if ! command -v tachyon-build >/dev/null 2>&1; then
          IAC_PLAN_OUTPUT="ERROR: Tachyon build CLI is unavailable"
        elif [ -z "${TACHYON_AUTH_TOKEN:-}" ]; then
          IAC_PLAN_OUTPUT="ERROR: TACHYON_AUTH_TOKEN is unavailable"
        else
          export TACHYON_API_KEY="${TACHYON_AUTH_TOKEN}"
          export TACHYON_TENANT_ID=tn_01hjjn348rn3t49zz6hvmfq67p
          export TACHYON_API_URL=https://api.n1.tachy.one
          set +e
          # Production desired state is applied by the release command before
          # triggering this build. The build-scoped token verifies that the
          # checked-out manifest has no drift without mutating its own app.
          IAC_PLAN_OUTPUT=$(tachyon-build manifest apply \
            -f "${CODEBUILD_SRC_DIR}/tachyon.yml" \
            --app pathbase \
            --environment production \
            --dry-run \
            2>&1)
          IAC_EXIT_CODE=$?
          set -e
          if [ "${IAC_EXIT_CODE}" = "0" ] || [ "${IAC_EXIT_CODE}" = "2" ]; then
            IAC_EXECUTION_STATE=succeeded
          else
            IAC_EXECUTION_STATE=failed
          fi
        fi
        printf '%s' "${IAC_PLAN_OUTPUT}" > /tmp/iac_output.txt
        printf '%s' "${IAC_EXIT_CODE}" > /tmp/iac_exit_code.txt
        printf '%s' "${IAC_EXECUTION_STATE}" > /tmp/iac_execution_state.txt
        echo "Tachyon IaC execution state: ${IAC_EXECUTION_STATE}"
        if [ "${IAC_EXIT_CODE}" != "0" ] && [ "${IAC_EXIT_CODE}" != "2" ]; then
          echo "${IAC_PLAN_OUTPUT}"
          exit "${IAC_EXIT_CODE}"
        fi
      - |
        source /tmp/build_env.sh
        set -o pipefail
        docker push "${IMAGE_URI}" 2>&1 | tee -a /tmp/build.log
        echo "Pushed ${IMAGE_URI}"
    finally:
      - |
        if [ -n "${CALLBACK_URL}" ]; then
          source /tmp/build_env.sh 2>/dev/null || true
          STATUS="FAILURE"
          ERROR_JSON="null"
          IMAGE_URI_JSON="null"
          IAC_PLAN_OUTPUT=""
          IAC_EXIT_CODE="1"
          IAC_EXECUTION_STATE="not_reported"
          if [ -f /tmp/iac_output.txt ]; then
            IAC_PLAN_OUTPUT=$(cat /tmp/iac_output.txt 2>/dev/null || true)
          fi
          if [ -f /tmp/iac_exit_code.txt ]; then
            IAC_EXIT_CODE=$(cat /tmp/iac_exit_code.txt 2>/dev/null || echo 1)
          fi
          if [ -f /tmp/iac_execution_state.txt ]; then
            IAC_EXECUTION_STATE=$(cat /tmp/iac_execution_state.txt 2>/dev/null || echo not_reported)
          fi
          if [ "${CODEBUILD_BUILD_SUCCEEDING}" = "1" ]; then
            STATUS="SUCCESS"
            if [ -n "${IMAGE_URI}" ]; then
              IMAGE_URI_JSON="\"${IMAGE_URI}\""
            fi
          else
            if [ "${IAC_EXECUTION_STATE}" = "failed" ] || [ "${IAC_EXECUTION_STATE}" = "not_reported" ]; then
              ERROR_JSON=$(printf '%s' "${IAC_PLAN_OUTPUT}" \
                | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' \
                2>/dev/null || echo '"Tachyon IaC failed"')
            elif [ -f /tmp/build.log ]; then
              ERROR_JSON=$(tail -50 /tmp/build.log \
                | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' \
                2>/dev/null || echo '"Build failed (log capture error)"')
            else
              ERROR_JSON='"Build failed"'
            fi
          fi
          IAC_JSON=$(printf '%s' "${IAC_PLAN_OUTPUT}" \
            | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' \
            2>/dev/null || echo null)
          IAC_SUCCESS=false
          if [ "${IAC_EXECUTION_STATE}" = "succeeded" ]; then
            IAC_SUCCESS=true
          fi
          DURATION_SECS=0
          if [ -n "${CODEBUILD_START_TIME:-}" ]; then
            NOW_SECS=$(date +%s)
            START_SECS=$((CODEBUILD_START_TIME / 1000))
            DURATION_SECS=$((NOW_SECS - START_SECS))
            if [ "${DURATION_SECS}" -lt 0 ]; then DURATION_SECS=0; fi
          fi
          curl -sf --retry 3 --max-time 10 \
            -X POST "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\
              \"build_id\":\"${INTERNAL_BUILD_ID}\",\
              \"status\":\"${STATUS}\",\
              \"image_uri\":${IMAGE_URI_JSON},\
              \"artifact_path\":null,\
              \"duration_secs\":${DURATION_SECS},\
              \"error_message\":${ERROR_JSON},\
              \"iac_plan_output\":${IAC_JSON},\
              \"iac_success\":${IAC_SUCCESS},\
              \"iac_execution_state\":\"${IAC_EXECUTION_STATE}\",\
              \"d1_migrations\":null,\
              \"cache_hit\":false,\
              \"cache_key\":null\
            }" \
            || echo "Callback failed (non-fatal)"
        fi
