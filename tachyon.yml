apiVersion: apps.tachy.one/v1alpha
kind: OAuth2Client
metadata:
  name: pathbase-local
  # The shared Tachyon platform tenant admits authenticated users from every
  # operator tenant; PathBase applies its own workspace authorization later.
  tenantId: tn_01hjjn348rn3t49zz6hvmfq67p
spec:
  clientType: public
  redirectUris:
    - http://localhost:1420/api/auth/callback
  allowedScopes:
    - openid
    - profile
    - email
  grantTypes:
    - authorization_code
    - refresh_token
  useTachyonUserPool: true
