apiVersion: apps.tachy.one/v1alpha
kind: OAuth2Client
metadata:
  name: pathbase-local
  # Keep the OAuth client with the Cloud App so tenant ownership is explicit.
  tenantId: tn_01m2a6ztfmd95p70gwgyshbevq
spec:
  clientType: public
  redirectUris:
    - http://localhost:1420/api/auth/callback
    - https://pathbase-v2.txcloud.app/api/auth/callback
  allowedScopes:
    - openid
    - profile
    - email
  grantTypes:
    - authorization_code
    - refresh_token
  useTachyonUserPool: true
---
apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: pathbase-v2
  tenantId: tn_01m2a6ztfmd95p70gwgyshbevq
spec:
  apps:
    - name: pathbase-v2
      repository:
        url: https://github.com/quantum-box/basepath
        owner: quantum-box
        name: basepath
        defaultBranch: main
      rootDirectory: ""
      framework: worker
      deploymentTarget: cloudflare_workers
      build:
        installCommand: npm ci --no-audit --no-fund
        command: npm run build
        nodeVersion: "22"
      readinessProof:
        path: /
        expectedStatus: 200
      worker:
        generateConfig: true
        main: worker/index.js
        compatibilityDate: "2026-09-14"
        assets:
          directory: dist/client
          binding: ASSETS
          notFoundHandling: none
      watchPaths:
        - api/**
        - public/**
        - scripts/**
        - src/**
        - Dockerfile
        - index.html
        - package-lock.json
        - package.json
        - tsconfig.json
        - vite.config.mjs
      envVars:
        - name: PATHBASE_API_ORIGIN
          value: https://pathbase-api.txcloud.app
        - name: PATHBASE_PUBLIC_URL
          value: https://pathbase-v2.txcloud.app
        - name: FIELD_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: FIELD_PLATFORM_ID
          value: tn_01hjjn348rn3t49zz6hvmfq67p
        - name: FIELD_OPERATOR_ID
          # Field's production tenant-directory root. This is deliberately not
          # the PathBase operator: Field forwards this context to Tachyon Auth
          # when evaluating the caller's delegated access token.
          value: tn_01j91h09tpj5ehwbwfwfxpak2b
    - name: pathbase-api
      repository:
        url: https://github.com/quantum-box/basepath
        owner: quantum-box
        name: basepath
        defaultBranch: main
      rootDirectory: api
      framework: cargo_lambda
      deploymentTarget: lambda
      build:
        package: pathbase-api
        binary: lambda-pathbase-api
        release: true
        arch: arm64
      readinessProof:
        path: /health
        expectedStatus: 200
        expectedBody: '"status":"ok"'
      watchPaths:
        - api/**
        - tachyon.yml
      envVars:
        - name: PATHBASE_MODE
          value: tachyon
        - name: PATHBASE_PUBLIC_URL
          value: https://pathbase-v2.txcloud.app
        - name: PATHBASE_DB
          value: /tmp/pathbase.sqlite3
        # Provision PATHBASE_SESSION_KEYS as an encrypted app environment
        # variable; key material must never be committed to this manifest.
        #
        # Field delegates authentication to Tachyon's Cognito verifier, which
        # only accepts tokens issued by the Cognito user pool (ADR-0036).
        # Registering the OAuth2Client below with useTachyonUserPool also
        # creates a secretless Cognito App Client with USER_PASSWORD_AUTH, so
        # TACHYON_OIDC_CLIENT_ID is already that App Client's id and setting
        # the issuer is enough to sign in against the pool directly. The user
        # pool id and region are public configuration, not secrets.
        - name: PATHBASE_COGNITO_ISSUER
          value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4
        - name: TACHYON_OIDC_ISSUER
          value: https://api.n1.tachy.one
        - name: TACHYON_OIDC_CLIENT_ID
          type: credential
          valueFrom:
            oauth2ClientRef:
              name: pathbase-local
              field: clientId
        - name: TACHYON_OIDC_REDIRECT_URI
          value: https://pathbase-v2.txcloud.app/api/auth/callback
        - name: TACHYON_API_URL
          value: https://api.n1.tachy.one
        - name: FIELD_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: FIELD_PLATFORM_ID
          value: tn_01hjjn348rn3t49zz6hvmfq67p
        - name: FIELD_OPERATOR_ID
          value: tn_01j91h09tpj5ehwbwfwfxpak2b
