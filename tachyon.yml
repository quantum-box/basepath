apiVersion: apps.tachy.one/v1alpha
kind: OAuth2Client
metadata:
  name: pathbase-local
  # Keep the OAuth client with the Cloud App so tenant ownership is explicit.
  tenantId: tn_01m2a6ztfmd95p70gwgyshbevq
spec:
  clientType: public
  redirectUris:
    - http://localhost:1420/api/auth/callback
    - https://pathbase-v2.txcloud.app/api/auth/callback
  allowedScopes:
    - openid
    - profile
    - email
  grantTypes:
    - authorization_code
    - refresh_token
  useTachyonUserPool: true
---
apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: pathbase-v2
  tenantId: tn_01m2a6ztfmd95p70gwgyshbevq
spec:
  apps:
    - name: pathbase-v2
      repository:
        url: https://github.com/quantum-box/basepath
        owner: quantum-box
        name: basepath
        defaultBranch: main
      rootDirectory: ""
      framework: worker
      deploymentTarget: cloudflare_workers
      build:
        installCommand: npm ci --no-audit --no-fund
        command: npm run build
        nodeVersion: "22"
      readinessProof:
        path: /
        expectedStatus: 200
      worker:
        generateConfig: true
        main: worker/index.js
        compatibilityDate: "2026-09-14"
        assets:
          directory: dist/client
          binding: ASSETS
          notFoundHandling: none
      watchPaths:
        - api/**
        - public/**
        - scripts/**
        - src/**
        - Dockerfile
        - index.html
        - package-lock.json
        - package.json
        - tsconfig.json
        - vite.config.mjs
      envVars:
        - name: PATHBASE_API_ORIGIN
          value: https://pathbase-api.txcloud.app
        - name: PATHBASE_PUBLIC_URL
          value: https://pathbase-v2.txcloud.app
        - name: FIELD_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: FIELD_PLATFORM_ID
          value: tn_01hjjn348rn3t49zz6hvmfq67p
        - name: FIELD_OPERATOR_ID
          # Field's production tenant-directory root. This is deliberately not
          # the PathBase operator: Field forwards this context to Tachyon Auth
          # when evaluating the caller's delegated access token.
          value: tn_01j91h09tpj5ehwbwfwfxpak2b
    - name: pathbase-api
      repository:
        url: https://github.com/quantum-box/basepath
        owner: quantum-box
        name: basepath
        defaultBranch: main
      rootDirectory: api
      framework: cargo_lambda
      deploymentTarget: lambda
      build:
        package: pathbase-api
        binary: lambda-pathbase-api
        release: true
        arch: arm64
      # Tachyon provisions the app's own TiDB database, SQL user, grant, and
      # DSN secret, and injects the DSN as DATABASE_URL. The manifest never
      # names a secret path or a literal DSN.
      #
      # NOTE: the canonical key is being renamed to `spec.database`
      # (PLT-4812). Until that ships in the platform this manifest uses the
      # key the deployed IaC accepts; the rename is a key rename only and
      # must not re-provision the database or rotate its credentials.
      provisionedDatabase:
        provider: tidb
        engine: mysql
        envVar: DATABASE_URL
        # `previewSharesProductionDatabase` is deliberately absent. ADR-0049
        # makes PR-scoped isolation the default, and a preview that resolved
        # the production DSN must be refused rather than silently allowed.
      #
      # Migration is not declared as a platform hook. The managed Cloud App
      # TiDB is PrivateLink-only, so a command hook on the shared runner
      # cannot reach it, and a `migration.lambdaInvoke` hook runs before the
      # candidate is deployed — it would therefore execute the *previously*
      # deployed code against the new database. The API applies its own
      # migrations at startup, inside the app's network, under a database-wide
      # advisory lock, and `/health/ready` below is the gate: a candidate
      # whose migration did not run, or that was pointed at another
      # deployment's database, never becomes the active deployment.
      readinessProof:
        path: /health/ready
        expectedStatus: 200
        expectedBody: '"schema":"current"'
      watchPaths:
        - api/**
        - tachyon.yml
      envVars:
        - name: PATHBASE_MODE
          value: tachyon
        - name: PATHBASE_PUBLIC_URL
          value: https://pathbase-v2.txcloud.app
        # Provision PATHBASE_SESSION_KEYS as an encrypted app environment
        # variable; key material must never be committed to this manifest.
        #
        # Field delegates authentication to Tachyon's Cognito verifier, which
        # only accepts tokens issued by the Cognito user pool (ADR-0036).
        # Registering the OAuth2Client below with useTachyonUserPool also
        # creates a secretless Cognito App Client with USER_PASSWORD_AUTH, so
        # TACHYON_OIDC_CLIENT_ID is already that App Client's id and setting
        # the issuer is enough to sign in against the pool directly. The user
        # pool id and region are public configuration, not secrets.
        - name: PATHBASE_COGNITO_ISSUER
          value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4
        - name: TACHYON_OIDC_ISSUER
          value: https://api.n1.tachy.one
        - name: TACHYON_OIDC_CLIENT_ID
          type: credential
          valueFrom:
            oauth2ClientRef:
              name: pathbase-local
              field: clientId
        - name: TACHYON_OIDC_REDIRECT_URI
          value: https://pathbase-v2.txcloud.app/api/auth/callback
        - name: TACHYON_API_URL
          value: https://api.n1.tachy.one
        - name: FIELD_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: FIELD_PLATFORM_ID
          value: tn_01hjjn348rn3t49zz6hvmfq67p
        - name: FIELD_OPERATOR_ID
          value: tn_01j91h09tpj5ehwbwfwfxpak2b
      # PATHBASE_DB_ENVIRONMENT is declared per environment, never in the base
      # list: the first process to migrate claims the database for its value,
      # and a process configured for a different one refuses to migrate or
      # serve. A production build pointed at a preview DSN therefore fails
      # closed instead of writing to the wrong database.
      environments:
        production:
          # Production keeps the base `provisionedDatabase` above; only the
          # environment label differs.
          envVars:
            - name: PATHBASE_DB_ENVIRONMENT
              value: production
        preview:
          # Each pull request gets its own database and credentials. Data and
          # permissions are therefore separate between PR A, PR B, and
          # production, and a preview never resolves the production DSN.
          provisionedDatabase:
            provider: tidb
            engine: mysql
            envVar: DATABASE_URL
          envVars:
            - name: PATHBASE_DB_ENVIRONMENT
              value: preview
