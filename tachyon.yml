apiVersion: apps.tachy.one/v1alpha
kind: OAuth2Client
metadata:
  name: pathbase-local
  # Keep the OAuth client with the Cloud App so tenant ownership is explicit.
  tenantId: tn_01m2a6ztfmd95p70gwgyshbevq
spec:
  clientType: public
  redirectUris:
    - http://localhost:1420/api/auth/callback
    - https://pathbase-v2.txcloud.app/api/auth/callback
  allowedScopes:
    - openid
    - profile
    - email
  grantTypes:
    - authorization_code
    - refresh_token
  useTachyonUserPool: true
---
apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: pathbase-v2
  tenantId: tn_01m2a6ztfmd95p70gwgyshbevq
spec:
  apps:
    - name: pathbase-v2
      repository:
        url: https://github.com/quantum-box/basepath
        owner: quantum-box
        name: basepath
        defaultBranch: main
      rootDirectory: api
      dockerContext: "."
      framework: rust_server
      deploymentTarget: cloud_run
      buildspecStrategy: repo:.codebuild/cloud_run_buildspec.yml
      build:
        # Docker-in-Docker requires the CodeBuild runner; the rootless k3s
        # runner cannot create the UID/GID map needed by BuildKit.
        runnerBackend: codebuild
        command: cargo build --locked --release
      readinessProof:
        path: /api/health
        expectedStatus: 200
        expectedBody: '"status":"ok"'
      watchPaths:
        - api/**
        - public/**
        - scripts/**
        - src/**
        - Dockerfile
        - index.html
        - package-lock.json
        - package.json
        - tsconfig.json
        - vite.config.mjs
      envVars:
        - name: PATHBASE_MODE
          value: tachyon
        - name: PATHBASE_PUBLIC_URL
          value: https://pathbase-v2.txcloud.app
        - name: PATHBASE_WEB_ROOT
          value: /app/web
        - name: PATHBASE_DB
          value: /app/data/pathbase.sqlite3
        - name: PATHBASE_SESSION_KEYS
          type: credential
          # Provision with `tachyon compute env set pathbase --secret
          # PATHBASE_SESSION_KEYS --value -`; never commit the key material.
          valueFrom:
            secret: pathbase/PATHBASE_SESSION_KEYS
        - name: TACHYON_OIDC_ISSUER
          value: https://api.n1.tachy.one
        - name: TACHYON_OIDC_CLIENT_ID
          type: credential
          valueFrom:
            oauth2ClientRef:
              name: pathbase-local
              field: clientId
        - name: TACHYON_OIDC_REDIRECT_URI
          value: https://pathbase-v2.txcloud.app/api/auth/callback
        - name: TACHYON_API_URL
          value: https://api.n1.tachy.one
        - name: FIELD_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: FIELD_PLATFORM_ID
          value: tn_01hjjn348rn3t49zz6hvmfq67p
        - name: FIELD_OPERATOR_ID
          # Field's production tenant-directory root. This is deliberately not
          # the PathBase operator: Field forwards this context to Tachyon Auth
          # when evaluating the caller's delegated access token.
          value: tn_01j91h09tpj5ehwbwfwfxpak2b
